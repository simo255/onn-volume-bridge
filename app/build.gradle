plugins { id 'com.android.application' }
def publishedStore = System.getenv('ONN_RELEASE_KEYSTORE')
android {
    namespace 'io.github.simo255.onnvolumebridge'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.simo255.onnvolumebridge'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '0.2.1'
    }
    signingConfigs {
        if (publishedStore) {
            published {
                storeFile file(publishedStore)
                storePassword System.getenv('ONN_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('ONN_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('ONN_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig publishedStore ? signingConfigs.published : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
